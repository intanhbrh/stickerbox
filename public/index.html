<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<title>Stickerbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='80' text-anchor='middle' fill='%23ff5fa2'%3E✧%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#efe9ff; --ink:#241b3a; --accent:#ff5fa2; --card:#ffffff; --soft:#e6defa; --edge:#ddd3f8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--ink);
         font-family:"Silkscreen","Trebuchet MS",system-ui,sans-serif;
         background-color:var(--bg);
         background-image:radial-gradient(#dcd2f7 1.6px, transparent 1.6px);
         background-size:20px 20px; }
  header { padding:18px 12px 0; max-width:900px; margin:0 auto; text-align:center; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  
  header p { margin:4px 0 0; opacity:.7; font-size:.85rem; }
  main { display:flex; flex-direction:column; gap:14px; padding:14px 12px 28px; max-width:900px; margin:0 auto; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row.center { justify-content:center; }

  /* buttons: chunky, press down when tapped */
  .btn, button { font:inherit; border:0; border-radius:999px; padding:10px 16px; cursor:pointer;
                 background:var(--ink); color:#fff; box-shadow:0 3px 0 rgba(36,27,58,.35); }
  .btn.alt, button.alt { background:var(--soft); color:var(--ink); box-shadow:0 3px 0 #b9acd9; }
  .btn:active, button:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(36,27,58,.35); }

  /* category tabs */
  .tabs { display:flex; gap:8px; }
  .tab { flex:1; padding:11px 6px; background:var(--card); color:var(--ink); font-size:.85rem;
         box-shadow:0 3px 0 var(--edge); }
  .tab.on { background:var(--accent); color:#fff; box-shadow:0 3px 0 #b83a74; }

  /* photo on the left, scrolling sticker column on the right */
  .editor { display:flex; gap:10px; }
  .stage { flex:1; min-width:0; min-height:280px; background:var(--card); padding:8px;
           border-radius:20px; box-shadow:0 5px 0 var(--edge);
           display:flex; justify-content:center; align-items:flex-start; }
  .canvas-container { border-radius:12px; overflow:hidden;
           background:repeating-conic-gradient(#f4f0ff 0 25%, #ffffff 0 50%) 50% / 16px 16px; }
  .preview-btn { position:absolute; right:8px; bottom:8px; z-index:5; width:26px; height:26px;
                 padding:0; border:0; border-radius:50%; background:rgba(0,0,0,.45); color:#fff;
                 font-size:12px; line-height:1; white-space:nowrap; display:grid; place-items:center;
                 box-shadow:none; }
  .drop { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:10px; text-align:center; font-size:.75rem; opacity:.85;
          pointer-events:none; padding:12px; }
  .drop[hidden] { display:none; }
  .drop button { pointer-events:auto; background:var(--accent); color:#fff; box-shadow:0 3px 0 #b83a74; }
  #preview { position:fixed; inset:0; z-index:10; background:rgba(20,12,35,.92); display:none;
             flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  #preview.open { display:flex; }
  #preview img { max-width:100%; max-height:calc(100% - 70px); object-fit:contain; border-radius:12px; }

  .stickers { position:relative; width:128px; flex:none; background:var(--card); border-radius:20px;
              box-shadow:0 5px 0 var(--edge); }
  .stickers .scroll { position:absolute; inset:0; overflow-y:auto; padding:10px 8px;
                      -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; }
  .grid[hidden] { display:none; }
  .grid button { font-family:system-ui,sans-serif; background:#f4f0ff; color:inherit; font-size:1.5rem;
                 line-height:1.2; padding:6px 0; border-radius:14px; box-shadow:0 2px 0 var(--edge); }
  .grid button svg { width:26px; height:26px; display:block; margin:0 auto; }
  /* emoticons: one per row, text wraps instead of stretching the tile */
  .grid.wide { grid-template-columns:1fr; }
  .grid.wide button { font-size:.85rem; line-height:1.3; padding:8px 6px;
                      overflow-wrap:anywhere; white-space:normal; }

  /* tools under the photo */
  .controls { background:var(--card); padding:14px; border-radius:20px; box-shadow:0 5px 0 var(--edge); }
  .tools { display:flex; justify-content:space-around; align-items:flex-start; gap:6px; transition:opacity .15s; }
  .controls.off .tools { opacity:.4; pointer-events:none; }
  .tool { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:.6rem; cursor:pointer; }
  .tool button { width:46px; height:46px; padding:0; border-radius:50%; background:var(--soft); color:var(--ink);
                 font-family:system-ui,sans-serif; font-size:1.1rem; box-shadow:0 3px 0 #b9acd9; }
  .tool input[type=color] { -webkit-appearance:none; appearance:none; width:46px; height:46px; padding:0;
                 border:3px solid #fff; border-radius:50%; background:none; cursor:pointer;
                 box-shadow:0 0 0 2px var(--soft), 0 3px 0 2px #b9acd9; }
  .tool input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
  .tool input[type=color]::-webkit-color-swatch { border:0; border-radius:50%; }
  .tool input[type=color]::-moz-color-swatch { border:0; border-radius:50%; }
  #save { background:var(--accent); width:100%; margin-top:16px; padding:15px; font-weight:700;
          font-size:1.05rem; box-shadow:0 4px 0 #b83a74; }
  #save:active { box-shadow:0 1px 0 #b83a74; }
  button:focus-visible, .btn:focus-within { outline:3px solid var(--accent); outline-offset:2px; }
 
  /* zoom & edit mode */
  body.zoom { overflow:hidden; }
  body.zoom .stage { position:fixed; inset:0; z-index:9; border-radius:0; box-shadow:none;
                     background:rgba(20,12,35,.95); padding:12px 12px 100px; align-items:center; }
  #zoomBar { display:none; position:fixed; left:0; right:0; bottom:0; z-index:12; align-items:center; gap:10px;
             padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
             background:var(--card); border-radius:20px 20px 0 0; box-shadow:0 -4px 0 var(--edge); }
  body.zoom #zoomBar { display:flex; }
  #zoomBar label { flex:1; display:flex; align-items:center; gap:10px; font-size:.75rem; min-width:0; }
  #size { flex:1; min-width:0; accent-color:var(--accent); }
  @media (min-width:700px) {
    .stickers { width:240px; }
    .grid { grid-template-columns:repeat(4, 1fr); }
    .grid.wide { grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1><span>✧</span> Stickerbox <span>✧</span></h1>
  <p>by @phuwinful</p>
</header>

<main>
  <div class="row center">
    <label class="btn">Add photo<input id="photo" type="file" accept="image/*" hidden></label>
    <label class="btn alt">Add PNG<input id="png" type="file" accept="image/*" hidden></label>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="emoji">Emoji</button>
    <button class="tab" data-tab="emoticons">Emoticons</button>
    <button class="tab" data-tab="shapes">Shapes</button>
  </div>

  <div class="editor">
    <div class="stage" id="stage">
      <canvas id="c" width="300" height="375"></canvas>
      <button class="preview-btn" id="previewBtn" aria-label="Preview full photo" title="Preview full photo">⌞ ⌝</button>
      <div class="drop" id="drop">
        <button id="dropBtn">＋ add a photo</button>
        <span>or just add stickers ♡</span>
      </div>
    </div>
    <aside class="stickers" aria-label="Stickers">
      <div class="scroll">
        <div id="emoji" class="grid"></div>
        <div id="emoticons" class="grid wide" hidden></div>
        <div id="shapes" class="grid" hidden></div>
      </div>
    </aside>
  </div>

  <section class="controls off" id="controls">
    <div class="tools">
      <label class="tool"><input id="color" type="color" value="#ffd84d" aria-label="Color"><span>color</span></label>
      <div class="tool"><button id="dup" aria-label="Duplicate">❐</button><span>copy</span></div>
      <div class="tool"><button id="front" aria-label="Bring to front">▲</button><span>front</span></div>
      <div class="tool"><button id="back" aria-label="Send to back">▼</button><span>back</span></div>
      <div class="tool"><button id="del" aria-label="Delete">✕</button><span>delete</span></div>
    </div>
    <button id="save">Save image ♡</button>
  </section>
  <p id="stats" style="text-align:center;font-size:.6rem;opacity:.5;margin:0"></p>
</main>

<div id="zoomBar">
  <label>size <input id="size" type="range" min="5" max="100" value="25" disabled></label>
  <button class="alt" id="zoomDel" aria-label="Delete">✕</button>
  <button id="zoomDone">Done</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
const canvas = new fabric.Canvas('c', { preserveObjectStacking: true });
const stage = document.getElementById('stage');

// Bigger, easier-to-grab handles on phones
fabric.Object.prototype.set({
  cornerSize: 16, touchCornerSize: 32, transparentCorners: false,
  cornerStyle: 'circle', cornerColor: '#ff5fa2', borderColor: '#ff5fa2'
});

// state.aspect = photo width / height. exportW = width of the saved image.
const state = { aspect: 4 / 5, exportW: 1080, bg: null };

// Put the preview button and the "add a photo" hint on top of the photo
const cc = document.querySelector('.canvas-container');
cc.appendChild(document.getElementById('previewBtn'));
cc.appendChild(document.getElementById('drop'));
document.getElementById('dropBtn').onclick = () => document.getElementById('photo').click();

fetch('https://stickerbox.goatcounter.com/counter/TOTAL.json')
  .then(r => r.json())
  .then(d => { document.getElementById('stats').textContent = d.count + ' visits'; })
  .catch(() => {});

// Size the canvas to the photo's shape and the available space, and rescale stickers with it
function layout() {
    const zoom = document.body.classList.contains('zoom');
  const availW = stage.clientWidth - (zoom ? 24 : 16);
  const maxH = zoom ? window.innerHeight - 150 : Math.min(window.innerHeight * 0.6, 560);
  const w = Math.max(120, Math.round(Math.min(availW, maxH * state.aspect)));
  const h = Math.round(w / state.aspect);
  const rx = w / canvas.getWidth(), ry = h / canvas.getHeight();
  if (Math.abs(rx - 1) > 0.001 || Math.abs(ry - 1) > 0.001) {
    canvas.getObjects().forEach(o => {
      o.scaleX *= rx; o.scaleY *= rx; o.left *= rx; o.top *= ry; o.setCoords();
    });
  }
  canvas.setDimensions({ width: w, height: h });
  if (state.bg) state.bg.set({ scaleX: w / state.bg.width, scaleY: h / state.bg.height });
  canvas.requestRenderAll();
}
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; layout(); }
});

// ---------- Zoom & edit mode ----------
const setZoom = on => { document.body.classList.toggle('zoom', on); layout(); };
document.getElementById('previewBtn').onclick = () => setZoom(!document.body.classList.contains('zoom'));
document.getElementById('zoomDone').onclick = () => setZoom(false);
document.getElementById('zoomDel').onclick = () => { const o = active(); if (o) canvas.remove(o); };
window.addEventListener('keydown', e => { if (e.key === 'Escape') setZoom(false); });

// ---------- Photo (background) ----------
function setPhoto(src) {
  fabric.Image.fromURL(src, img => {
    const k = Math.min(1, 2160 / Math.max(img.width, img.height));
    state.aspect = img.width / img.height;
    state.exportW = Math.round(img.width * k);
    img.set({ left: 0, top: 0, originX: 'left', originY: 'top' });
    state.bg = img;
    canvas.setBackgroundImage(img, () => {});
    document.getElementById('drop').hidden = true;
    layout();
  });
}

// ---------- Stickers ----------
function place(obj, width) {
  if (width) obj.scaleToWidth(width);
  obj.set({ left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center' });
  canvas.add(obj); canvas.setActiveObject(obj); canvas.requestRenderAll();
}
function addPng(src) {
  fabric.Image.fromURL(src, img => place(img, canvas.getWidth() * 0.35));
}
function addEmoji(ch) {
  place(new fabric.Text(ch, { fontSize: Math.round(canvas.getWidth() * 0.2) }));
}
// Emoticons: sized to fit the photo (short ones stay small, long ones shrink to ~half the width)
function addEmoticon(str) {
  const t = new fabric.Text(str, {
    fontSize: 40, fontFamily: 'system-ui, sans-serif', textAlign: 'center', fill: '#ffffff',
    shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.35)', blur: 4, offsetX: 0, offsetY: 1 })
  });
  const cw = canvas.getWidth();
  const scale = Math.min((cw * 0.5) / t.width, (cw * 0.14) / 40);
  t.scale(scale);
  t.isShape = true; // recolorable with the color picker
  place(t);
}
const SVG = (path, fill) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="${path}" fill="${fill}"/></svg>`;
const SHAPES = {
  star:    SVG('M50 5l14 31 33 4-25 23 7 33-29-17-29 17 7-33L3 40l33-4z', '#ffd84d'),
  sparkle: SVG('M50 0C54 30 70 46 100 50 70 54 54 70 50 100 46 70 30 54 0 50 30 46 46 30 50 0z', '#ffd84d'),
  heart:   SVG('M50 90C10 60 0 40 0 28 0 12 12 2 26 2c10 0 20 6 24 14C54 8 64 2 74 2c14 0 26 10 26 26 0 12-10 32-50 62z', '#ff6b9a'),
  circle:  SVG('M5 50a45 45 0 1 0 90 0a45 45 0 1 0 -90 0z', '#ff6b9a'),
  moon:    SVG('M60 5a45 45 0 1 0 35 65A38 38 0 0 1 60 5z', '#ffd84d'),
  cloud:   SVG('M13 47a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM33 34a22 22 0 1 0 44 0a22 22 0 1 0 -44 0zM58 50a17 17 0 1 0 34 0a17 17 0 1 0 -34 0zM33 50v17h42V50z', '#9fd8ff'),
  flower:  SVG('M30 22a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM56.6 41.3a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM46.5 72.6a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM13.5 72.6a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM3.4 41.3a20 20 0 1 0 40 0a20 20 0 1 0 -40 0zM36 50a14 14 0 1 0 28 0a14 14 0 1 0 -28 0z', '#ffb3d1'),
  paw:     SVG('M12 44a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM30 24a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM50 24a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM68 44a10 10 0 1 0 20 0a10 10 0 1 0 -20 0zM28 68a22 22 0 1 0 44 0a22 22 0 1 0 -44 0z', '#b79cff'),
  cat:     SVG('M14 60a36 36 0 1 0 72 0a36 36 0 1 0 -72 0zM15 48L47 28L18 8zM85 48L82 8L53 28z', '#ffb3d1'),
  bolt:    SVG('M58 3L18 55h26l-8 42 44-56H54z', '#ffd84d'),
  diamond: SVG('M50 3L95 50L50 97L5 50z', '#9fd8ff'),
  blush3:  SVG('M19.2 79.7L35.2 29.7A5.5 5.5 0 0 0 24.8 26.3L8.8 76.3A5.5 5.5 0 0 0 19.2 79.7zM45.2 79.7L61.2 29.7A5.5 5.5 0 0 0 50.8 26.3L34.8 76.3A5.5 5.5 0 0 0 45.2 79.7zM71.2 79.7L87.2 29.7A5.5 5.5 0 0 0 76.8 26.3L60.8 76.3A5.5 5.5 0 0 0 71.2 79.7z', '#ff8fb8'),
  blush2:  SVG('M32.2 79.7L48.2 29.7A5.5 5.5 0 0 0 37.8 26.3L21.8 76.3A5.5 5.5 0 0 0 32.2 79.7zM58.2 79.7L74.2 29.7A5.5 5.5 0 0 0 63.8 26.3L47.8 76.3A5.5 5.5 0 0 0 58.2 79.7z', '#ff8fb8'),
  glowcircle: SVG('M10 50a40 40 0 1 0 80 0a40 40 0 1 0 -80 0z', '#fff3b0'),
  glowoval:   SVG('M22 50a28 40 0 1 0 56 0a28 40 0 1 0 -56 0z', '#ffc2dd')
};

// Shapes that glow (name: glow color)
const GLOW = { glowcircle: '#fff3b0', glowoval: '#ffc2dd' };

function addShape(svg, name) {
  fabric.loadSVGFromString(svg, (objs, opts) => {
    const g = fabric.util.groupSVGElements(objs, opts);
    g.isShape = true;
    if (GLOW[name]) {
      g.glow = true;
      g.set('shadow', new fabric.Shadow({ color: GLOW[name], blur: 30, offsetX: 0, offsetY: 0 }));
    }
    place(g, canvas.getWidth() * 0.25);
  });
}

function recolor(obj, color) {
  const paint = o => { o.set('fill', color); if (o.stroke) o.set('stroke', color); };
  obj.type === 'group' ? obj.getObjects().forEach(paint) : paint(obj);
  if (obj.glow) obj.set('shadow', new fabric.Shadow({ color, blur: 30, offsetX: 0, offsetY: 0 }));
  canvas.requestRenderAll();
}

// ---------- Build the sticker column ----------
const emojiBox = document.getElementById('emoji');
['✨','⭐','🌟','💫','💖','🎀','🍥','🌸','🌼','🐰ྀི','🧁','🪷','🦋','🐱','😺','🐰','🐶','🐾','🔥','😎','🥹','☁️','☁︎','🌙','🍑','🫶','🧿',
 '🍓','🍒','🌈','🎧','💌','👑','🪩','🕊️','🍀','🧸','💋','🌷','🫧','💗','💛','❤️','💕','🖤','🤍','💚','🤎']
  .forEach(ch => {
    const b = document.createElement('button');
    b.textContent = ch; b.onclick = () => addEmoji(ch); emojiBox.appendChild(b);
  });

const emoticonBox = document.getElementById('emoticons');
const emoticons = [...new Set(
  document.getElementById('emoticon-data').textContent
    .split('\n').map(s => s.trim()).filter(Boolean)
)];
emoticons.forEach(str => {
  const b = document.createElement('button');
  b.textContent = str; b.onclick = () => addEmoticon(str); emoticonBox.appendChild(b);
});

const shapeBox = document.getElementById('shapes');
Object.entries(SHAPES).forEach(([name, svg]) => {
  const b = document.createElement('button');
  b.innerHTML = svg; b.title = name; b.onclick = () => addShape(svg, name);
  if (GLOW[name]) b.firstElementChild.style.filter = `drop-shadow(0 0 4px ${GLOW[name]})`;
  shapeBox.appendChild(b);
});

// ---------- Category tabs ----------
const panels = { emoji: emojiBox, emoticons: emoticonBox, shapes: shapeBox };
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
    Object.entries(panels).forEach(([name, el]) => { el.hidden = name !== tab.dataset.tab; });
    document.querySelector('.stickers .scroll').scrollTop = 0;
  };
});

// ---------- Inputs ----------
document.getElementById('photo').onchange = e => {
  const f = e.target.files[0]; if (f) setPhoto(URL.createObjectURL(f));
};
document.getElementById('png').onchange = e => {
  const f = e.target.files[0]; if (f) addPng(URL.createObjectURL(f));
};
// Paste a copied image, emoji or emoticon straight in
window.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const img = items.find(i => i.type.startsWith('image/'));
  if (img) { addPng(URL.createObjectURL(img.getAsFile())); return; }
  const text = e.clipboardData?.getData('text')?.trim();
  if (!text) return;
  const isEmoji = Array.from(text).length <= 4 && /\p{Extended_Pictographic}/u.test(text);
  isEmoji ? addEmoji(text) : addEmoticon(text.slice(0, 80));
});
// Drag and drop a photo onto the page
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) setPhoto(URL.createObjectURL(f));
});

// ---------- Selected sticker controls ----------
const active = () => canvas.getActiveObject();
document.getElementById('color').oninput = e => { const o = active(); if (o && o.isShape) recolor(o, e.target.value); };
document.getElementById('front').onclick = () => { const o = active(); if (o) { canvas.bringToFront(o); canvas.requestRenderAll(); } };
document.getElementById('back').onclick  = () => { const o = active(); if (o) { canvas.sendToBack(o);  canvas.requestRenderAll(); } };
document.getElementById('del').onclick   = () => { const o = active(); if (o) canvas.remove(o); };
document.getElementById('dup').onclick   = () => {
  const o = active(); if (!o) return;
  o.clone(c => { c.isShape = o.isShape; c.set({ left: o.left + 15, top: o.top + 15 }); canvas.add(c); canvas.setActiveObject(c); });
};
window.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && active() && !active().isEditing) canvas.remove(active());
});

// Tools look faded until a sticker is selected
const controls = document.getElementById('controls');
const syncTools = () => controls.classList.toggle('off', !active());
['selection:created', 'selection:updated', 'selection:cleared'].forEach(ev => canvas.on(ev, syncTools));
syncTools();
// Size slider: sets the selected sticker's width as % of the photo
const sizeEl = document.getElementById('size');
const syncSize = () => {
  const o = active();
  sizeEl.disabled = !o;
  if (o) sizeEl.value = Math.round(o.getScaledWidth() / canvas.getWidth() * 100);
};
['selection:created', 'selection:updated', 'selection:cleared', 'object:scaling', 'object:modified']
  .forEach(ev => canvas.on(ev, syncSize));
sizeEl.oninput = e => {
  const o = active(); if (!o) return;
  o.scaleToWidth(canvas.getWidth() * e.target.value / 100);
  o.setCoords(); canvas.requestRenderAll();
};
// ---------- Save (full photo quality) ----------
document.getElementById('save').onclick = async () => {
  canvas.discardActiveObject().renderAll();
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'saved-image', title: 'Saved image', event: true });
  const url = canvas.toDataURL({ format: 'png', multiplier: state.exportW / canvas.getWidth() });
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], 'stickerbox.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) { /* fall back to download */ }
  }
  const a = document.createElement('a'); a.href = url; a.download = 'stickerbox.png'; a.click();
};

layout();
window.addEventListener('load', layout);
</script>
<script data-goatcounter="https://stickerbox.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
